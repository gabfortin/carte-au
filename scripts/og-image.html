<!DOCTYPE html>
<!--
  Gabarit de l'image de partage og-image.jpg (1200 × 630), même style que
  avantapres/assets/img/og-image.png. Pour la refaire : ouvrir ce fichier dans un
  navigateur, fenêtre de 1200 × 630, faire une capture, puis la convertir en JPG
  (ex. ffmpeg -i capture.png -q:v 2 og-image.jpg) à la racine du dépôt.
-->
<html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(520px 380px at 80% 18%, rgba(96, 165, 250, 0.35), transparent 70%),
      linear-gradient(120deg, #0b1630 0%, #12306f 45%, #1d4ed8 100%);
    font-family: 'Inter', sans-serif; color: #fff;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .deco {
    position: absolute; right: -120px; bottom: -170px; width: 480px; height: 480px; opacity: .11;
  }
  .content { position: absolute; left: 88px; top: 115px; }
  .mark {
    width: 92px; height: 92px; border-radius: 26px;
    background: linear-gradient(140deg, #60a5fa, #1d4ed8);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .mark svg { width: 54px; height: 54px; }
  h1 {
    margin: 44px 0 0; font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 84px; line-height: 1; letter-spacing: -0.02em;
  }
  h1 span { color: #93c5fd; }
  p { margin: 26px 0 0; font-size: 31px; font-weight: 500; line-height: 1.35; color: rgba(255,255,255,.88); max-width: 760px; }
</style></head>
<body>
  <div class="grid"></div>
  <svg class="deco" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="4.6" r="2" fill="#fff"/>
    <path d="M5.5 8.6 12 9.8l6.5-1.2M12 9.8v4.4m0 0-3 5.4m3-5.4 3 5.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="4.6" r="2" fill="#fff"/>
        <path d="M5.5 8.6 12 9.8l6.5-1.2M12 9.8v4.4m0 0-3 5.4m3-5.4 3 5.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Montréal <span>Accessible</span></h1>
    <p>Une carte de l'accessibilité universelle à Montréal</p>
  </div>
</body></html>
