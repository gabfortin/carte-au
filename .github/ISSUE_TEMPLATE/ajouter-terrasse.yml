name: "Ajouter une terrasse inspectée"
description: "Proposez une terrasse commerciale dont l'accessibilité a été inspectée."
title: "[Ajouter terrasse] "
labels: ["ajouter-item", "terrasses"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de contribuer à la carte. Remplissez les champs ci-dessous
        aussi précisément que possible. Une fois votre soumission révisée
        et approuvée, elle sera intégrée automatiquement à la carte.

        💡 Pour obtenir la latitude et la longitude : clic droit sur
        l'emplacement dans [Google Maps](https://maps.google.com) ou
        [OpenStreetMap](https://www.openstreetmap.org), puis copier les
        coordonnées.

  - type: input
    id: nom
    attributes:
      label: "Nom de la terrasse / du commerce"
      placeholder: "Terrasse du Bar L'Barouf"
    validations:
      required: true

  - type: input
    id: adresse
    attributes:
      label: "Adresse complète"
      placeholder: "123 rue Saint-Denis, Montréal, QC"
    validations:
      required: true

  - type: input
    id: lat
    attributes:
      label: "Latitude"
      placeholder: "45.5142"
    validations:
      required: true

  - type: input
    id: lng
    attributes:
      label: "Longitude"
      placeholder: "-73.5904"
    validations:
      required: true

  - type: dropdown
    id: niveau
    attributes:
      label: "Niveau d'accessibilité"
      options:
        - "Accessible"
        - "Partiellement accessible"
        - "Non accessible"
        - "Inconnu"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Notes d'inspection (optionnel)"
      description: "Détails libres sur l'accessibilité (ex : accès, largeur de passage, mobilier amovible)."

  - type: textarea
    id: images
    attributes:
      label: "Photos (optionnel) — glissez chaque image ici"
      description: >-
        Glissez-déposez (ou collez) une ou plusieurs photos, une après
        l'autre. Pour chacune, remplacez le texte entre crochets `[ ]`
        par une courte description de ce qu'elle montre.
      placeholder: "![Accès à la terrasse depuis le trottoir](l'image collée ira ici)"

  - type: input
    id: votre_nom
    attributes:
      label: "Votre nom (affiché publiquement, optionnel)"
      description: "Laissez vide pour rester anonyme."

  - type: checkboxes
    id: consentement
    attributes:
      label: "Consentement"
      options:
        - label: "Si j'ai ajouté des photos, j'autorise leur publication sur cette carte."
