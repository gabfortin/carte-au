name: "Ajouter un bâtiment municipal accessible"
description: "Proposez un bâtiment municipal (piscine, aréna, bibliothèque, centre sportif...) à ajouter à la carte."
title: "[Ajouter bâtiment municipal] "
labels: ["ajouter-item", "batiments-municipaux"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de contribuer à la carte. Remplissez les champs ci-dessous
        aussi précisément que possible. Une fois votre soumission révisée
        et approuvée, elle sera intégrée automatiquement à la carte.

        💡 Pour obtenir la latitude et la longitude : clic droit sur
        l'emplacement dans [Google Maps](https://maps.google.com) ou
        [OpenStreetMap](https://www.openstreetmap.org), puis copier les
        coordonnées.

  - type: input
    id: nom
    attributes:
      label: "Nom du bâtiment"
      placeholder: "Aréna des Patineuses"
    validations:
      required: true

  - type: dropdown
    id: categorie
    attributes:
      label: "Catégorie"
      options:
        - "Piscine"
        - "Bibliothèque"
        - "Parc"
        - "Aréna"
        - "Centre sportif"
        - "Autre"
    validations:
      required: true

  - type: input
    id: adresse
    attributes:
      label: "Adresse complète"
      placeholder: "5633 rue Saint-Dominique, Montréal, QC"
    validations:
      required: true

  - type: input
    id: lat
    attributes:
      label: "Latitude"
      placeholder: "45.5142"
    validations:
      required: true

  - type: input
    id: lng
    attributes:
      label: "Longitude"
      placeholder: "-73.5904"
    validations:
      required: true

  - type: dropdown
    id: niveau
    attributes:
      label: "Niveau d'accessibilité"
      options:
        - "Accessible"
        - "Partiellement accessible"
        - "Non accessible"
        - "Inconnu"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Notes (optionnel)"
      description: "Détails libres sur l'accessibilité."

  - type: input
    id: source_url
    attributes:
      label: "Lien vers la fiche du bâtiment sur montreal.ca (optionnel)"
      placeholder: "https://montreal.ca/lieux/..."

  - type: textarea
    id: images
    attributes:
      label: "Photos (optionnel) — glissez chaque image ici"
      description: >-
        Glissez-déposez (ou collez) une ou plusieurs photos, une après
        l'autre. Pour chacune, remplacez le texte entre crochets `[ ]`
        par une courte description de ce qu'elle montre (ex : « Entrée
        accessible côté stationnement »).
      placeholder: "![Entrée accessible côté stationnement](l'image collée ira ici)"

  - type: input
    id: votre_nom
    attributes:
      label: "Votre nom (affiché publiquement, optionnel)"
      description: "Laissez vide pour rester anonyme."

  - type: checkboxes
    id: consentement
    attributes:
      label: "Consentement"
      options:
        - label: "Si j'ai ajouté des photos, j'autorise leur publication sur cette carte."
