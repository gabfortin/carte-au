name: "Ajouter un débarcadère accessible"
description: "Proposez un débarcadère réservé aux personnes handicapées à ajouter à la carte."
title: "[Ajouter débarcadère] "
labels: ["ajouter-item", "debarcaderes"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de contribuer à la carte. Remplissez les champs ci-dessous
        aussi précisément que possible. Une fois votre soumission révisée
        et approuvée, elle sera intégrée automatiquement à la carte.

        💡 Pour obtenir la latitude et la longitude : clic droit sur
        l'emplacement dans [Google Maps](https://maps.google.com) ou
        [OpenStreetMap](https://www.openstreetmap.org), puis copier les
        coordonnées.

  - type: input
    id: description
    attributes:
      label: "Description courte"
      placeholder: "Débarcadère réservé aux personnes handicapées"
    validations:
      required: true

  - type: input
    id: adresse
    attributes:
      label: "Adresse ou intersection (optionnel)"
      placeholder: "Rue Rachel, coin Saint-Hubert"

  - type: input
    id: lat
    attributes:
      label: "Latitude"
      placeholder: "45.5142"
    validations:
      required: true

  - type: input
    id: lng
    attributes:
      label: "Longitude"
      placeholder: "-73.5904"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Notes (optionnel)"
      description: "Détails libres (ex : panneau, horaire, état de l'aménagement)."

  - type: textarea
    id: images
    attributes:
      label: "Photos (optionnel) — glissez chaque image ici"
      description: >-
        Glissez-déposez (ou collez) une ou plusieurs photos, une après
        l'autre. Pour chacune, remplacez le texte entre crochets `[ ]`
        par une courte description de ce qu'elle montre (ex : « Panneau
        débarcadère réservé handicapés »).
      placeholder: "![Panneau débarcadère réservé handicapés](l'image collée ira ici)"

  - type: input
    id: votre_nom
    attributes:
      label: "Votre nom (affiché publiquement, optionnel)"
      description: "Laissez vide pour rester anonyme."

  - type: checkboxes
    id: consentement
    attributes:
      label: "Consentement"
      options:
        - label: "Si j'ai ajouté des photos, j'autorise leur publication sur cette carte."
